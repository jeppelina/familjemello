<!DOCTYPE html>
<html lang="sv">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#1e1044" />
  <title>Familje-Mello</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%8E%A4%3C/text%3E%3C/svg%3E" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="preconnect" href="https://i.ytimg.com" />
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700;900&display=swap" rel="stylesheet" />
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.118.0/dist/umd/supabase.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.2/dist/confetti.browser.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.js"></script>
  <style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --bg-dark: #0f0a2e;
  --bg-card: rgba(255,255,255,0.07);
  --bg-card-hover: rgba(255,255,255,0.11);
  --line: rgba(255,255,255,0.09);
  --purple: #7c3aed;
  --pink: #ec4899;
  --blue: #3b82f6;
  --gold: #f59e0b;
  --gold-light: #fbbf24;
  --green: #10b981;
  --red: #ef4444;
  --text: #f1f5f9;
  --text-muted: #a3b0c2;
  --gradient-main: linear-gradient(135deg, #1e1044 0%, #2d1b69 30%, #1a0a3e 60%, #0f0a2e 100%);
  --gradient-pink: linear-gradient(135deg, #ec4899, #a855f7);
  --gradient-gold: linear-gradient(135deg, #f59e0b, #fbbf24);
  --gradient-blue: linear-gradient(135deg, #3b82f6, #7c3aed);
  --row: 66px;
}

html { -webkit-text-size-adjust: 100%; }
body {
  font-family: 'Outfit', system-ui, sans-serif;
  background: #1a0a3e var(--gradient-main) fixed;
  color: var(--text);
  min-height: 100vh;
  overflow-x: hidden;
}
/* Slow ambient glow. Transform-only, so it stays on the GPU. */
body::before {
  content: '';
  position: fixed;
  inset: -25%;
  background: radial-gradient(ellipse at 30% 20%, rgba(124,58,237,0.15) 0%, transparent 50%),
              radial-gradient(ellipse at 70% 80%, rgba(236,72,153,0.1) 0%, transparent 50%);
  animation: ambientShift 24s ease-in-out infinite;
  z-index: 0;
  pointer-events: none;
  will-change: transform;
}
@keyframes ambientShift { 0%, 100% { transform: translate(0, 0); } 50% { transform: translate(2%, -2%); } }

button { font-family: inherit; color: inherit; }
a { color: inherit; }
#root { position: relative; z-index: 1; }

.container { max-width: 980px; margin: 0 auto; padding: 16px 20px; min-height: 100vh; display: flex; flex-direction: column; }
.main { flex: 1; padding-bottom: 24px; }
.header { position: relative; text-align: center; padding: 18px 0 6px; }
.logo {
  font-size: 2.6rem; font-weight: 900; letter-spacing: -1px;
  background: linear-gradient(135deg, var(--gold), var(--pink), var(--purple));
  -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text;
}
.logo-sub { font-size: 0.95rem; color: var(--text-muted); margin-top: 2px; }
.header-tools { position: absolute; top: 14px; right: 0; display: flex; gap: 6px; }
.icon-btn { width: 38px; height: 38px; border-radius: 10px; border: 1px solid var(--line); background: var(--bg-card); cursor: pointer; font-size: 1.05rem; }
.icon-btn:hover { background: var(--bg-card-hover); }

.toast {
  position: fixed; top: 14px; left: 50%; transform: translateX(-50%); z-index: 50;
  background: rgba(16,185,129,0.95); color: #04261b; font-weight: 700; padding: 12px 20px; border-radius: 12px;
  box-shadow: 0 8px 30px rgba(0,0,0,0.35); cursor: pointer; animation: fadeInUp 0.3s ease-out; max-width: calc(100% - 32px);
}

.phase-indicator { display: flex; justify-content: center; gap: 8px; margin: 14px 0 24px; flex-wrap: wrap; }
.phase-dot { padding: 6px 14px; border-radius: 20px; font-size: 0.8rem; font-weight: 600; background: var(--bg-card); color: var(--text-muted); }
.phase-dot.active { background: var(--gradient-pink); color: white; }
.phase-dot.completed { background: rgba(16,185,129,0.18); color: var(--green); }

.card { background: var(--bg-card); border: 1px solid var(--line); border-radius: 16px; padding: 22px; margin-bottom: 16px; }
.card-title { font-size: 1.1rem; font-weight: 700; margin-bottom: 14px; }
.section-title { font-size: 1.3rem; font-weight: 700; margin: 8px 0 14px; }

.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; padding: 12px 26px; border: none; border-radius: 12px; font-size: 1rem; font-weight: 700; cursor: pointer; transition: transform 0.15s, background 0.15s; text-decoration: none; }
.btn:hover { transform: translateY(-2px); }
.btn:active { transform: translateY(0); }
.btn-primary { background: var(--gradient-pink); color: white; box-shadow: 0 4px 18px rgba(236,72,153,0.3); }
.btn-gold { background: var(--gradient-gold); color: #1a0a3e; box-shadow: 0 4px 18px rgba(245,158,11,0.3); }
.btn-blue { background: var(--gradient-blue); color: white; box-shadow: 0 4px 18px rgba(59,130,246,0.3); }
.btn-ghost { background: var(--bg-card); color: var(--text); border: 1px solid rgba(255,255,255,0.12); }
.btn-sm { padding: 8px 14px; font-size: 0.85rem; }
.btn-lg { padding: 16px 38px; font-size: 1.2rem; }
.btn:disabled { opacity: 0.4; cursor: not-allowed; transform: none !important; }
.link-btn { background: none; border: none; color: var(--text-muted); text-decoration: underline; cursor: pointer; font-size: 0.85rem; padding: 4px; }
.link-btn:hover { color: var(--text); }

.input { width: 100%; padding: 12px 14px; border: 1px solid rgba(255,255,255,0.15); border-radius: 10px; background: rgba(255,255,255,0.05); color: var(--text); font-family: inherit; font-size: 1rem; outline: none; }
.input:focus { border-color: var(--purple); box-shadow: 0 0 0 3px rgba(124,58,237,0.25); }
.input::placeholder { color: var(--text-muted); }
.input-row { display: flex; gap: 10px; margin-bottom: 10px; align-items: center; }
.input-row .input { flex: 1; }
.code-input { max-width: 140px; text-align: center; letter-spacing: 6px; font-weight: 800; text-transform: uppercase; }
.lookup-line { font-size: 0.85rem; margin: -2px 0 10px; }

.muted { color: var(--text-muted); }
.small { font-size: 0.82rem; }
.ok { color: var(--green); font-weight: 600; }
.err { color: #fca5a5; font-size: 0.88rem; }
.text-center { text-align: center; }
.mt-16 { margin-top: 16px; }
.mt-24 { margin-top: 24px; }
.flex-between { display: flex; align-items: center; justify-content: space-between; gap: 10px; }

.tag { display: inline-flex; align-items: center; gap: 6px; padding: 6px 8px 6px 14px; border-radius: 20px; font-size: 0.9rem; font-weight: 600; background: rgba(124,58,237,0.2); color: #ddd6fe; border: 1px solid rgba(124,58,237,0.25); }
.tag-btn { background: rgba(255,255,255,0.08); border: none; border-radius: 12px; width: 28px; height: 26px; cursor: pointer; font-size: 0.85rem; }
.tag-btn:hover { background: rgba(255,255,255,0.18); }
.voter-tags { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 8px; }

.badge { display: inline-block; padding: 3px 10px; border-radius: 6px; font-size: 0.75rem; font-weight: 800; }
.badge-gold { background: rgba(245,158,11,0.22); color: var(--gold-light); }
.badge-red { background: rgba(239,68,68,0.15); color: #fca5a5; }

.segmented { display: inline-flex; background: rgba(0,0,0,0.25); border-radius: 12px; padding: 4px; gap: 4px; flex-wrap: wrap; }
.segmented button { border: none; background: transparent; padding: 9px 16px; border-radius: 9px; cursor: pointer; font-weight: 700; color: var(--text-muted); }
.segmented button.active { background: var(--gradient-pink); color: white; }
.plan-line { margin-top: 14px; padding: 12px 14px; border-radius: 10px; background: rgba(59,130,246,0.08); border: 1px solid rgba(59,130,246,0.2); font-size: 0.9rem; line-height: 1.5; }

.hof-row { display: flex; gap: 12px; align-items: baseline; padding: 8px 0; border-bottom: 1px solid var(--line); flex-wrap: wrap; }
.hof-row:last-child { border-bottom: none; }
.hof-date { color: var(--text-muted); font-size: 0.8rem; font-variant-numeric: tabular-nums; min-width: 84px; }
.hof-song { flex: 1; }
.join-card { max-width: 420px; margin: 8px auto 0; }

@keyframes fadeInUp { from { opacity: 0; transform: translateY(18px); } to { opacity: 1; transform: translateY(0); } }
@keyframes scaleIn { from { opacity: 0; transform: scale(0.9); } to { opacity: 1; transform: scale(1); } }
@keyframes slideReveal { from { opacity: 0; transform: translateX(-30px); } to { opacity: 1; transform: translateX(0); } }
@keyframes starPop { 0% { transform: scale(1); } 50% { transform: scale(1.35); } 100% { transform: scale(1); } }
@keyframes recapSlideIn { from { opacity: 0; transform: scale(0.88) translateY(24px); } to { opacity: 1; transform: scale(1) translateY(0); } }
@keyframes introZoom { 0% { opacity: 0; transform: scale(0.3) rotate(-5deg); } 60% { opacity: 1; transform: scale(1.08) rotate(1deg); } 100% { opacity: 1; transform: scale(1) rotate(0); } }
@keyframes introShine { 0% { background-position: -200% center; } 100% { background-position: 200% center; } }
@keyframes spotlightSweep { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
@keyframes floatParticle { 0% { transform: translateY(0) scale(1); opacity: 0; } 15% { opacity: 0.8; } 100% { transform: translateY(-110vh) scale(0.3); opacity: 0; } }
@keyframes resultBarGrow { from { width: 0; } to { width: var(--bar-width); } }
@keyframes shimmer { 0% { left: -100%; } 100% { left: 200%; } }
@keyframes countdownPop { 0% { transform: scale(0.2); opacity: 0; } 55% { transform: scale(1.25); opacity: 1; } 100% { transform: scale(1); opacity: 1; } }
@keyframes stageLight { 0%, 100% { opacity: 0.03; } 50% { opacity: 0.08; } }
@keyframes glowPulse { 0%, 100% { opacity: 0.35; } 50% { opacity: 1; } }
@keyframes drumDot { 0%, 100% { transform: translateY(0); opacity: 0.4; } 50% { transform: translateY(-8px); opacity: 1; } }
@keyframes deltaUp { 0% { opacity: 0; transform: translateY(8px) scale(0.6); } 25% { opacity: 1; transform: translateY(0) scale(1.15); } 80% { opacity: 1; } 100% { opacity: 0; transform: translateY(-10px); } }
@keyframes bump { 0% { background: rgba(245,158,11,0.35); } 100% { background: var(--bg-card); } }

.animate-in { animation: fadeInUp 0.4s ease-out; }
.animate-scale { animation: scaleIn 0.3s ease-out; }

/* Glow that pulses with opacity on a pseudo-element: no per-frame repaint of shadows. */
.result-row.winner, .announce.twelve, .sb-row.winner { position: relative; }
.result-row.winner::after, .announce.twelve::after, .sb-row.winner::after {
  content: ''; position: absolute; inset: -1px; border-radius: inherit; pointer-events: none;
  box-shadow: 0 0 34px rgba(245,158,11,0.55); animation: glowPulse 2s ease-in-out infinite;
}

/* ===== Intro ===== */
.intro-screen { position: relative; text-align: center; padding: 40px 12px 30px; overflow: hidden; min-height: 70vh; display: flex; flex-direction: column; align-items: center; justify-content: center; }
.intro-screen::before {
  content: ''; position: absolute; top: -50%; left: -50%; width: 200%; height: 200%;
  background: conic-gradient(from 0deg, transparent 0%, rgba(236,72,153,0.08) 10%, transparent 20%, rgba(124,58,237,0.08) 30%, transparent 40%);
  animation: spotlightSweep 10s linear infinite; pointer-events: none;
}
.intro-badge { display: inline-block; padding: 8px 22px; border-radius: 20px; font-size: 0.85rem; font-weight: 700; letter-spacing: 3px; text-transform: uppercase; margin-bottom: 18px; animation: fadeInUp 0.6s ease-out 0.2s both; }
.intro-emoji { font-size: 5rem; margin-bottom: 12px; animation: introZoom 0.8s cubic-bezier(0.34, 1.56, 0.64, 1) 0.1s both; }
.intro-title {
  font-size: 3rem; font-weight: 900; margin-bottom: 8px;
  background: linear-gradient(90deg, var(--gold), var(--pink), var(--gold)); background-size: 200% auto;
  -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text;
  animation: introZoom 0.7s cubic-bezier(0.34, 1.56, 0.64, 1) 0.3s both, introShine 3s linear 1.5s infinite;
}
.intro-theme { font-size: 1.3rem; font-weight: 600; color: var(--text-muted); animation: fadeInUp 0.6s ease-out 0.6s both; }
.intro-songs { margin-top: 24px; display: flex; flex-direction: column; gap: 10px; width: 100%; max-width: 520px; }
.intro-song-pill { display: flex; align-items: center; gap: 12px; padding: 12px 18px; border-radius: 14px; background: rgba(255,255,255,0.06); border: 1px solid var(--line); text-align: left; animation: fadeInUp 0.5s ease-out both; }
.intro-song-num { width: 32px; height: 32px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-weight: 800; font-size: 0.9rem; flex-shrink: 0; }
.intro-song-info { flex: 1; min-width: 0; }
.intro-song-title { font-weight: 700; }
.intro-song-artist { font-size: 0.82rem; color: var(--text-muted); }
.intro-start-btn { margin-top: 32px; animation: fadeInUp 0.6s ease-out 1.2s both; }
.intro-start-btn .btn { position: relative; overflow: hidden; }
.intro-start-btn .btn::after { content: ''; position: absolute; top: 0; left: -100%; width: 50%; height: 100%; background: linear-gradient(90deg, transparent, rgba(255,255,255,0.22), transparent); animation: shimmer 2.5s ease-in-out infinite 2s; }

.particles { position: fixed; inset: 0; pointer-events: none; z-index: 0; overflow: hidden; }
.particle { position: absolute; bottom: -20px; border-radius: 50%; opacity: 0; animation: floatParticle var(--dur) ease-in infinite; animation-delay: var(--delay); will-change: transform, opacity; }
.stage-lights { position: absolute; inset: 0; pointer-events: none; overflow: hidden; z-index: 0; }
.stage-light { position: absolute; top: -20%; width: 120px; height: 200%; background: linear-gradient(180deg, var(--light-color) 0%, transparent 60%); opacity: 0.04; transform-origin: top center; animation: stageLight 4s ease-in-out infinite; }

/* ===== Ratings ===== */
.stars { display: flex; gap: 2px; }
.star { background: none; border: none; font-size: 2rem; cursor: pointer; user-select: none; filter: grayscale(1) brightness(0.35); transition: transform 0.12s; padding: 2px; line-height: 1; }
.star:hover { transform: scale(1.15); }
.star.active { filter: none; animation: starPop 0.25s ease-out; }
.stars-big { justify-content: center; gap: 8px; }
.stars-big .star { font-size: 2.6rem; }
.stars-text { letter-spacing: -2px; }

.emoji-rating { display: flex; gap: 8px; }
.emoji-btn { background: rgba(255,255,255,0.06); border: 2px solid transparent; border-radius: 14px; cursor: pointer; padding: 4px 10px; display: flex; flex-direction: column; align-items: center; gap: 2px; }
.emoji-face { font-size: 1.9rem; line-height: 1.1; filter: grayscale(0.7); opacity: 0.6; }
.emoji-btn.active { border-color: var(--gold); background: rgba(245,158,11,0.15); }
.emoji-btn.active .emoji-face { filter: none; opacity: 1; animation: starPop 0.25s ease-out; }
.emoji-big { justify-content: center; gap: 10px; }
.emoji-big .emoji-btn { flex: 1; padding: 12px 6px; max-width: 120px; }
.emoji-big .emoji-face { font-size: 3.2rem; }
.emoji-label { font-size: 0.75rem; color: var(--text-muted); font-weight: 600; }

/* ===== Video ===== */
.video-wrap { position: relative; width: 100%; aspect-ratio: 16 / 9; border-radius: 12px; overflow: hidden; background: #000; margin-bottom: 16px; }
.yt-host, .yt-host iframe { position: absolute; inset: 0; width: 100%; height: 100%; border: none; }
.video-error { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px; text-align: center; padding: 20px; background: rgba(15,10,46,0.94); }
.video-hint { position: absolute; left: 50%; bottom: 14px; transform: translateX(-50%); background: rgba(0,0,0,0.75); padding: 8px 14px; border-radius: 10px; font-weight: 600; pointer-events: none; }

.thumb { display: block; object-fit: cover; background: #1a0a3e; }
.thumb-empty { display: flex; align-items: center; justify-content: center; color: var(--text-muted); }

/* ===== Setup list ===== */
.song-item { display: flex; align-items: center; gap: 12px; padding: 10px 12px; border-radius: 10px; background: rgba(255,255,255,0.03); margin-bottom: 8px; }
.song-number { width: 28px; height: 28px; border-radius: 8px; display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 0.82rem; background: var(--bg-card); flex-shrink: 0; }
.song-thumb { width: 64px; height: 36px; border-radius: 6px; flex-shrink: 0; }
.song-info { flex: 1; min-width: 0; }
.song-title { font-weight: 600; }
.song-artist { font-size: 0.82rem; color: var(--text-muted); }
.song-meta { font-size: 0.74rem; color: var(--text-muted); font-style: italic; }
.demo-banner { text-align: center; padding: 16px; border-radius: 12px; background: rgba(59,130,246,0.08); border: 1px dashed rgba(59,130,246,0.3); margin-bottom: 16px; }
.demo-banner p { color: var(--text-muted); font-size: 0.88rem; margin-bottom: 10px; }

/* ===== Stage ===== */
.group-label { text-align: center; font-size: 1.4rem; font-weight: 900; margin-bottom: 4px; }
.gl-text { background: var(--gradient-pink); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; }
.gl-emoji { margin-right: 8px; }
.gl-emoji.after { margin: 0 0 0 8px; }
.group-sublabel { text-align: center; color: var(--text-muted); margin-bottom: 18px; font-size: 0.92rem; }
.song-tabs { display: flex; gap: 8px; margin-bottom: 18px; flex-wrap: wrap; justify-content: center; }
.song-tab { position: relative; padding: 9px 16px; border-radius: 12px; border: 1px solid rgba(255,255,255,0.1); background: var(--bg-card); cursor: pointer; font-size: 0.85rem; font-weight: 600; max-width: 210px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.song-tab:hover { background: var(--bg-card-hover); }
.song-tab.active { background: var(--gradient-pink); border-color: transparent; color: white; }
.song-tab.voted { border-color: rgba(16,185,129,0.45); }
.tab-check { position: absolute; top: -1px; right: -1px; width: 18px; height: 18px; border-radius: 0 12px 0 8px; background: var(--green); color: white; font-size: 0.65rem; display: flex; align-items: center; justify-content: center; }
.now-playing { text-align: center; margin-bottom: 12px; }
.now-playing-count { font-size: 0.75rem; color: var(--text-muted); text-transform: uppercase; letter-spacing: 2px; margin-bottom: 4px; }
.now-playing-song { font-size: 1.35rem; font-weight: 800; }
.now-playing-artist { color: var(--text-muted); font-size: 0.92rem; }
.voter-row { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 10px 0; border-bottom: 1px solid var(--line); flex-wrap: wrap; }
.voter-row:last-child { border-bottom: none; }
.voter-name { font-weight: 600; font-size: 1rem; min-width: 80px; }
.voter-status { display: flex; align-items: center; gap: 12px; font-size: 0.9rem; }
.all-voted-banner { text-align: center; padding: 12px; border-radius: 12px; background: rgba(16,185,129,0.1); border: 1px solid rgba(16,185,129,0.3); color: var(--green); font-weight: 600; margin-top: 12px; }
.nav-arrows { display: flex; justify-content: space-between; align-items: center; margin-top: 18px; gap: 12px; }
.nav-arrows .btn { min-width: 120px; }
.nav-center { flex: 1; text-align: center; }

/* QR panel and the slim bar shown during rounds */
.live-dot { display: inline-block; width: 9px; height: 9px; border-radius: 50%; background: var(--text-muted); margin-left: 8px; vertical-align: middle; }
.live-dot.on { background: var(--green); box-shadow: 0 0 8px var(--green); }
.vote-panel { border-color: rgba(245,158,11,0.25); background: rgba(245,158,11,0.06); }
.vote-panel-body { display: flex; gap: 22px; align-items: center; margin-top: 14px; flex-wrap: wrap; justify-content: center; }
.vote-panel-qr { width: 190px; height: 190px; display: block; border-radius: 12px; background: white; }
.vote-panel-info { text-align: center; }
.vote-panel-url { font-size: 0.95rem; font-weight: 600; word-break: break-all; max-width: 280px; }
.room-code { font-size: 2.2rem; font-weight: 900; letter-spacing: 8px; color: var(--gold); }
.vote-bar { display: flex; width: 100%; align-items: center; justify-content: center; gap: 6px; flex-wrap: wrap; padding: 9px 14px; margin-bottom: 14px; border-radius: 12px; border: 1px solid rgba(245,158,11,0.25); background: rgba(245,158,11,0.06); cursor: pointer; font-size: 0.88rem; }
.vote-bar b { color: var(--gold); letter-spacing: 2px; }
.vote-bar-more { color: var(--text-muted); margin-left: 6px; }

/* ===== Recap ===== */
.recap-card { position: relative; background: linear-gradient(135deg, rgba(124,58,237,0.16), rgba(236,72,153,0.1)); border: 1px solid rgba(236,72,153,0.25); border-radius: 20px; overflow: hidden; animation: recapSlideIn 0.5s ease-out; margin-bottom: 18px; box-shadow: 0 0 40px rgba(236,72,153,0.18); }
.recap-card .video-wrap { margin-bottom: 0; border-radius: 0; }
.recap-thumb { width: 100%; aspect-ratio: 16 / 9; }
.recap-info { padding: 20px; text-align: center; }
.recap-number { font-size: 0.8rem; color: var(--pink); text-transform: uppercase; letter-spacing: 3px; font-weight: 700; margin-bottom: 6px; }
.recap-song-title { font-size: 1.8rem; font-weight: 900; margin-bottom: 4px; }
.recap-song-artist { font-size: 1.05rem; color: var(--text-muted); }
.recap-progress { height: 4px; background: rgba(255,255,255,0.1); border-radius: 2px; margin-top: 16px; overflow: hidden; }
.recap-progress-bar { height: 100%; background: var(--gradient-pink); transition: width 0.25s linear; }
.recap-controls { display: flex; justify-content: center; gap: 12px; align-items: center; flex-wrap: wrap; }
.recap-dots { text-align: center; margin-top: 12px; }
.dot { display: inline-block; width: 10px; height: 10px; border-radius: 50%; margin: 0 3px; background: rgba(255,255,255,0.15); }
.dot.current { background: var(--pink); }
.dot.seen { background: var(--green); }

/* ===== Tiebreak ===== */
.tiebreak-card { text-align: center; }
.tiebreak-head { font-size: 1.05rem; margin-bottom: 4px; }
.tiebreak-q { font-size: 1.25rem; font-weight: 800; margin-bottom: 14px; }
.tb-options { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 12px; margin-bottom: 12px; }
.tb-option { display: flex; flex-direction: column; gap: 4px; padding: 0 0 10px; border-radius: 14px; overflow: hidden; border: 2px solid rgba(255,255,255,0.1); background: rgba(255,255,255,0.05); cursor: pointer; text-align: center; transition: transform 0.15s, border-color 0.15s; }
.tb-option:hover { transform: translateY(-3px); border-color: var(--gold); }
.tb-option .thumb { width: 100%; aspect-ratio: 16 / 9; }
.tb-title { font-weight: 800; padding: 4px 8px 0; }
.tb-artist { font-size: 0.78rem; color: var(--text-muted); padding: 0 8px; }
.tb-option.dim { opacity: 0.5; }
.tb-options.phone { grid-template-columns: 1fr 1fr; }

/* ===== Reveal ===== */
.reveal-start { margin: 24px 0; }
.auto-toggle { display: flex; justify-content: center; align-items: center; gap: 8px; margin-top: 14px; color: var(--text-muted); font-size: 0.88rem; cursor: pointer; }
.announce { text-align: center; padding: 22px 18px; border-radius: 20px; margin: 4px 0 18px; min-height: 168px; background: linear-gradient(135deg, rgba(124,58,237,0.22), rgba(236,72,153,0.16)); border: 1px solid rgba(236,72,153,0.3); animation: recapSlideIn 0.45s cubic-bezier(0.34,1.56,0.64,1); display: flex; flex-direction: column; align-items: center; justify-content: center; }
.announce.twelve { background: linear-gradient(135deg, rgba(245,158,11,0.26), rgba(236,72,153,0.18)); border-color: rgba(245,158,11,0.55); }
.announce.pending { border-style: dashed; }
.announce.done { min-height: 0; background: rgba(16,185,129,0.1); border-color: rgba(16,185,129,0.35); }
.announce-who { font-size: 1.15rem; color: var(--text-muted); margin-bottom: 6px; }
.announce-who b { color: var(--text); font-size: 1.5rem; }
.announce-drum { font-size: 1.7rem; font-weight: 800; }
.announce-phone { margin-top: 10px; font-weight: 700; color: var(--gold-light); animation: glowPulse 1.2s ease-in-out infinite; }
.announce-final-list { font-size: 1.3rem; font-weight: 800; }
.announce-twelve-song { display: flex; align-items: center; gap: 14px; margin-top: 4px; text-align: left; }
.announce-thumb { width: 120px; height: 68px; border-radius: 10px; }
.tie-note { margin-top: 8px; color: var(--gold-light); font-weight: 600; }
.drum-dots { display: flex; gap: 8px; margin-top: 12px; }
.drum-dots span { width: 12px; height: 12px; border-radius: 50%; background: var(--gold); animation: drumDot 0.6s ease-in-out infinite; }
.drum-dots span:nth-child(2) { animation-delay: 0.15s; }
.drum-dots span:nth-child(3) { animation-delay: 0.3s; }
.low-chips { display: flex; flex-wrap: wrap; justify-content: center; gap: 10px; margin-top: 6px; }
.low-chip { display: flex; align-items: center; gap: 8px; padding: 8px 14px 8px 8px; border-radius: 30px; background: rgba(0,0,0,0.25); font-weight: 600; animation: scaleIn 0.35s ease-out both; }
.low-pts { min-width: 34px; height: 34px; border-radius: 50%; display: flex; align-items: center; justify-content: center; background: var(--gradient-gold); color: #1a0a3e; font-weight: 900; }
.reveal-points { font-size: 3.6rem; font-weight: 900; line-height: 1; background: var(--gradient-gold); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; animation: countdownPop 0.5s cubic-bezier(0.34,1.56,0.64,1); }
.reveal-points.big { font-size: 5rem; }
.reveal-goesto { color: var(--text-muted); font-size: 0.85rem; letter-spacing: 2px; text-transform: uppercase; margin: 6px 0 4px; }
.reveal-song { font-size: 1.7rem; font-weight: 800; line-height: 1.15; }
.reveal-controls { display: flex; justify-content: center; gap: 10px; margin-top: 16px; flex-wrap: wrap; }

.scoreboard { position: relative; }
.sb-row {
  position: absolute; left: 0; right: 0; top: 0; height: calc(var(--row) - 8px);
  display: flex; align-items: center; gap: 12px; padding: 0 14px; border-radius: 12px;
  background: var(--bg-card); border: 1px solid var(--line);
  transition: transform 0.7s cubic-bezier(0.34, 1.3, 0.64, 1), opacity 0.4s, border-color 0.4s;
}
.sb-row.bumped { animation: bump 1.4s ease-out; }
.sb-row.qualified { border-color: rgba(245,158,11,0.45); background: rgba(245,158,11,0.09); }
.sb-row.out { opacity: 0.55; }
.sb-row.winner { border-color: rgba(245,158,11,0.6); background: rgba(245,158,11,0.15); }
.sb-pos { width: 30px; text-align: center; font-weight: 900; font-size: 1.15rem; }
.sb-thumb { width: 72px; height: 40px; border-radius: 6px; flex-shrink: 0; }
.sb-info { flex: 1; min-width: 0; }
.sb-title { font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.sb-artist { font-size: 0.78rem; color: var(--text-muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.sb-points { font-size: 1.5rem; font-weight: 900; color: var(--gold); min-width: 46px; text-align: right; font-variant-numeric: tabular-nums; }
.sb-delta { color: var(--gold-light); font-weight: 900; animation: deltaUp 2s ease-out forwards; }

/* ===== Winner ===== */
.winner-container { text-align: center; padding: 30px 12px; }
.winner-trophy { font-size: 5rem; margin-bottom: 10px; animation: scaleIn 0.5s ease-out; }
.winner-label { font-size: 1.15rem; color: var(--gold); font-weight: 600; margin-bottom: 14px; text-transform: uppercase; letter-spacing: 3px; }
.winner-thumb { width: min(360px, 90%); aspect-ratio: 16 / 9; border-radius: 16px; margin: 0 auto 16px; box-shadow: 0 10px 40px rgba(245,158,11,0.3); }
.winner-song { font-size: 2.4rem; font-weight: 900; margin-bottom: 6px; background: var(--gradient-gold); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; filter: drop-shadow(0 0 18px rgba(245,158,11,0.45)); }
.winner-artist { font-size: 1.3rem; color: var(--text-muted); margin-bottom: 6px; }
.winner-picker { font-size: 1.05rem; font-weight: 700; margin-bottom: 18px; }
.winner-score { font-size: 3rem; font-weight: 900; color: var(--gold); }
.winner-actions { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; margin-top: 16px; }
.result-row { display: flex; align-items: center; gap: 12px; padding: 12px 16px; border-radius: 12px; margin-bottom: 10px; background: var(--bg-card); border: 1px solid var(--line); animation: slideReveal 0.4s ease-out both; }
.result-row.winner { border-color: rgba(245,158,11,0.5); background: rgba(245,158,11,0.13); }
.result-position { font-size: 1.4rem; font-weight: 900; width: 36px; text-align: center; }
.result-info { flex: 1; min-width: 0; }
.result-title { font-weight: 700; font-size: 1.05rem; }
.result-artist { font-size: 0.85rem; color: var(--text-muted); }
.result-score { font-size: 1.3rem; font-weight: 900; color: var(--gold); }
.result-bar-container { position: relative; height: 6px; background: rgba(255,255,255,0.08); border-radius: 3px; margin-top: 8px; overflow: hidden; }
.result-bar { height: 100%; border-radius: 3px; width: 0; animation: resultBarGrow 1s ease-out forwards; }
.picker-row { display: flex; align-items: center; gap: 12px; padding: 9px 0; border-bottom: 1px solid var(--line); }
.picker-row:last-child { border-bottom: none; }
.picker-row.top { font-size: 1.15rem; }
.picker-name { flex: 1; font-weight: 700; }
.picker-points { font-weight: 900; color: var(--gold); font-variant-numeric: tabular-nums; }

/* ===== Phone ===== */
.phone-wrap { max-width: 480px; margin: 0 auto; padding: 16px 16px 40px; min-height: 100vh; display: flex; flex-direction: column; }
.phone-header { text-align: center; margin-bottom: 16px; }
.phone-sub { color: var(--text-muted); font-size: 0.9rem; margin-top: 2px; letter-spacing: 1px; }
.phone-card { background: var(--bg-card); border: 1px solid var(--line); border-radius: 18px; padding: 22px 18px; text-align: center; }
.phone-h { font-size: 1.35rem; font-weight: 800; margin-bottom: 6px; }
.phone-eyebrow { font-size: 0.78rem; color: var(--text-muted); text-transform: uppercase; letter-spacing: 2px; margin-bottom: 10px; }
.phone-thumb { width: 100%; aspect-ratio: 16 / 9; border-radius: 12px; margin-bottom: 12px; }
.phone-song-title { font-size: 1.6rem; font-weight: 900; line-height: 1.15; }
.phone-song-artist { color: var(--text-muted); margin-top: 4px; }
.phone-picker { margin-top: 6px; font-size: 0.85rem; color: var(--gold-light); font-weight: 600; }
.phone-msg { color: var(--text-muted); font-size: 1.05rem; line-height: 1.5; }
.phone-now { margin-top: 10px; color: var(--text); }
.phone-vote-row { padding: 14px 0; border-bottom: 1px solid var(--line); }
.phone-vote-row:last-child { border-bottom: none; padding-bottom: 2px; }
.phone-vote-name { font-weight: 700; font-size: 1.15rem; margin-bottom: 6px; }
.phone-sending { color: var(--gold-light); font-size: 0.85rem; font-weight: 600; }
.phone-turn { border-color: rgba(245,158,11,0.5); background: rgba(245,158,11,0.1); }
.phone-big-btn { width: 100%; font-size: 1.5rem; padding: 26px 16px; border-radius: 18px; }

@media (max-width: 640px) {
  :root { --row: 58px; }
  .logo { font-size: 2rem; }
  .header { padding-top: 54px; }
  .header-tools { left: 0; right: 0; top: 8px; justify-content: center; }
  .container { padding: 10px 14px; }
  .card { padding: 16px; }
  .star { font-size: 1.6rem; }
  .input-row { flex-direction: column; align-items: stretch; }
  .song-tab { padding: 8px 12px; font-size: 0.8rem; }
  .recap-song-title { font-size: 1.4rem; }
  .intro-title { font-size: 2.1rem; }
  .intro-emoji { font-size: 3.5rem; }
  .sb-thumb { display: none; }
  .sb-points { font-size: 1.25rem; }
  .announce-thumb { width: 84px; height: 48px; }
  .reveal-song { font-size: 1.35rem; }
  .nav-arrows .btn { min-width: 0; }
}

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: 0.01ms !important; animation-iteration-count: 1 !important; transition-duration: 0.01ms !important; }
  .particles, .stage-lights { display: none; }
}
